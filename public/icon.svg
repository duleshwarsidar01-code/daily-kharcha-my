<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="16"/>
  <!-- Rupee Symbol -->
  <g fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- Top horizontal bar -->
    <line x1="168" y1="148" x2="344" y2="148"/>
    <!-- Second horizontal bar -->
    <line x1="168" y1="216" x2="310" y2="216"/>
    <!-- Vertical stem and upper curve -->
    <path d="M 232 148 L 232 284 C 304 284 336 244 336 216 C 336 188 304 148 232 148"/>
    <!-- Diagonal leg -->
    <line x1="228" y1="284" x2="344" y2="388"/>
  </g>
</svg>
